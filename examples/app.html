<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>应用列表 · Quiet Design System</title>
    <meta name="description" content="Quiet Design System 示例：应用里的列表页。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../components.css" />
    <script src="../site.js"></script>
    <script src="examples.js" defer></script>
  </head>
  <body>
    <!-- 顶栏 -->
    <header class="q-topbar">
      <button class="q-icon-button" id="menu" aria-label="菜单" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M3 6.5h12M3 11.5h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
      <a href="../">Quiet</a>
      <span class="q-topbar-sep">/</span>
      <a href="app.html">应用列表</a>
      <button class="q-icon-button q-topbar-end" id="theme" aria-label="切换深浅色">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <circle cx="9" cy="9" r="6.1" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M9 2.9a6.1 6.1 0 0 1 0 12.2z" fill="currentColor" />
        </svg>
      </button>
    </header>

    <!-- 全屏导航 -->
    <nav class="q-nav" id="nav" hidden>
      <div class="q-nav-group">
        <a class="q-nav-link" href="../">首页</a>
        <a class="q-nav-link" href="../docs/">文档</a>
        <a class="q-nav-link" href="../writing/">文章</a>
      </div>
      <div class="q-nav-group">
        <span class="q-nav-label">示例</span>
        <a class="q-nav-link" href="../examples/personal.html">个人主页</a>
        <a class="q-nav-link" href="../examples/product.html">产品首页</a>
        <a class="q-nav-link" href="../examples/app.html" aria-current="page">应用列表</a>
        <a class="q-nav-link" href="../examples/settings.html">设置页</a>
      </div>
      <div class="q-nav-group">
        <span class="q-nav-label">设计系统</span>
        <a class="q-nav-link" href="https://github.com/wolfyxbt/quiet-design-system">源码</a>
        <a class="q-nav-link" href="https://github.com/wolfyxbt/quiet-design-system/blob/main/DESIGN.md">设计规范</a>
      </div>
    </nav>

    <!-- 应用页：768px 宽。标题和主按钮 → 标签页 → 数据概览 → 搜索和表格 -->
    <main class="q-page q-page--app">
      <div class="q-header">
        <h1 class="q-title">文档</h1>
        <button class="q-button q-button--primary" type="button" id="new-doc">新建文档</button>
      </div>

      <div class="q-tabs" role="tablist" aria-label="按状态筛选">
        <button class="q-tab" type="button" role="tab" aria-selected="true" data-filter="all">全部</button>
        <button class="q-tab" type="button" role="tab" aria-selected="false" data-filter="draft">草稿</button>
        <button class="q-tab" type="button" role="tab" aria-selected="false" data-filter="review">审阅中</button>
        <button class="q-tab" type="button" role="tab" aria-selected="false" data-filter="published">已发布</button>
      </div>

      <dl class="q-stats">
        <div class="q-stat">
          <dt class="q-stat-label">文档</dt>
          <dd class="q-stat-value" id="stat-docs">8</dd>
        </div>
        <div class="q-stat">
          <dt class="q-stat-label">已发布</dt>
          <dd class="q-stat-value">4</dd>
        </div>
        <div class="q-stat">
          <dt class="q-stat-label">总字数</dt>
          <dd class="q-stat-value">28,565</dd>
        </div>
      </dl>

      <section class="q-section">
        <input class="q-input" type="search" id="search" placeholder="搜索文档" aria-label="搜索文档" />

        <div class="q-table-wrap">
          <table class="q-table">
            <thead>
              <tr>
                <th>标题</th>
                <th>状态</th>
                <th class="q-num">字数</th>
                <th class="q-num">更新</th>
              </tr>
            </thead>
            <tbody id="docs">
              <tr data-status="published">
                <td>2026 年产品路线</td>
                <td><span class="q-status q-status--success">已发布</span></td>
                <td class="q-num">4,280</td>
                <td class="q-num q-muted">05.12</td>
              </tr>
              <tr data-status="published">
                <td>新成员入职指南</td>
                <td><span class="q-status q-status--success">已发布</span></td>
                <td class="q-num">6,120</td>
                <td class="q-num q-muted">05.09</td>
              </tr>
              <tr data-status="review">
                <td>评论功能改版方案</td>
                <td><span class="q-status q-status--warning">审阅中</span></td>
                <td class="q-num">2,940</td>
                <td class="q-num q-muted">05.08</td>
              </tr>
              <tr data-status="draft">
                <td>五月用户访谈记录</td>
                <td><span class="q-status">草稿</span></td>
                <td class="q-num">1,360</td>
                <td class="q-num q-muted">05.07</td>
              </tr>
              <tr data-status="review">
                <td>定价调整说明</td>
                <td><span class="q-status q-status--warning">审阅中</span></td>
                <td class="q-num">1,875</td>
                <td class="q-num q-muted">04.28</td>
              </tr>
              <tr data-status="published">
                <td>写作规范</td>
                <td><span class="q-status q-status--success">已发布</span></td>
                <td class="q-num">3,410</td>
                <td class="q-num q-muted">04.21</td>
              </tr>
              <tr data-status="draft">
                <td>周会纪要模板</td>
                <td><span class="q-status">草稿</span></td>
                <td class="q-num">520</td>
                <td class="q-num q-muted">04.15</td>
              </tr>
              <tr data-status="published">
                <td>年度复盘</td>
                <td><span class="q-status q-status--success">已发布</span></td>
                <td class="q-num">8,060</td>
                <td class="q-num q-muted">03.30</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 空状态：一句灰色的话就够了 -->
        <p class="q-meta" id="empty" hidden>没有符合条件的文档。</p>
      </section>
    </main>

    <!-- 对话框 -->
    <dialog class="q-dialog" id="new-doc-dialog" aria-labelledby="new-doc-title">
      <form method="dialog" id="new-doc-form">
        <h2 class="q-dialog-title" id="new-doc-title">新建文档</h2>
        <div class="q-form">
          <label class="q-field">
            <span class="q-field-label">标题</span>
            <input class="q-input" type="text" name="title" id="new-doc-name" placeholder="比如：六月产品周报" autocomplete="off" />
            <span class="q-field-error" id="new-doc-error" hidden>标题不能为空。</span>
          </label>
        </div>
        <div class="q-actions">
          <button class="q-button q-button--ghost" type="button" data-close>取消</button>
          <button class="q-button q-button--primary" type="submit">创建</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
