<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置页 · Quiet Design System</title>
    <meta name="description" content="Quiet Design System 示例：应用里的设置页。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../components.css" />
    <script src="../site.js"></script>
    <script src="examples.js" defer></script>
  </head>
  <body>
    <!-- 顶栏 -->
    <header class="q-topbar">
      <button class="q-icon-button" id="menu" aria-label="菜单" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M3 6.5h12M3 11.5h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
      <a href="../">Quiet</a>
      <span class="q-topbar-sep">/</span>
      <a href="settings.html">设置页</a>
      <button class="q-icon-button q-topbar-end" id="theme" aria-label="切换深浅色">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <circle cx="9" cy="9" r="6.1" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M9 2.9a6.1 6.1 0 0 1 0 12.2z" fill="currentColor" />
        </svg>
      </button>
    </header>

    <!-- 全屏导航 -->
    <nav class="q-nav" id="nav" hidden>
      <div class="q-nav-group">
        <a class="q-nav-link" href="../">首页</a>
        <a class="q-nav-link" href="../writing/">文章</a>
      </div>
      <div class="q-nav-group">
        <span class="q-nav-label">示例</span>
        <a class="q-nav-link" href="../examples/personal.html">个人主页</a>
        <a class="q-nav-link" href="../examples/product.html">产品首页</a>
        <a class="q-nav-link" href="../examples/app.html">应用列表</a>
        <a class="q-nav-link" href="../examples/settings.html" aria-current="page">设置页</a>
      </div>
      <div class="q-nav-group">
        <span class="q-nav-label">设计系统</span>
        <a class="q-nav-link" href="https://github.com/wolfyxbt/quiet-design-system">源码</a>
        <a class="q-nav-link" href="https://github.com/wolfyxbt/quiet-design-system/blob/main/DESIGN.md">设计规范</a>
      </div>
    </nav>

    <!-- 表单页：672px 宽。标题 → 若干个「标签 + 字段」→ 保存 -->
    <main class="q-page">
      <h1 class="q-title">设置</h1>

      <section class="q-section">
        <h2 class="q-section-label">个人资料</h2>
        <form class="q-form" id="profile" novalidate>
          <label class="q-field">
            <span class="q-field-label">名称</span>
            <input class="q-input" type="text" name="name" id="profile-name" value="林一" autocomplete="off" />
            <span class="q-field-error" id="profile-name-error" hidden>名称不能为空。</span>
          </label>
          <label class="q-field">
            <span class="q-field-label">邮箱</span>
            <input class="q-input" type="email" name="email" value="lin@example.com" autocomplete="off" />
            <span class="q-field-hint">用于登录和接收每周摘要。</span>
          </label>
          <label class="q-field">
            <span class="q-field-label">简介</span>
            <textarea class="q-textarea" name="bio" placeholder="一两句话介绍自己"></textarea>
          </label>
          <label class="q-field">
            <span class="q-field-label">语言</span>
            <select class="q-select" name="lang">
              <option>简体中文</option>
              <option>繁體中文</option>
              <option>English</option>
            </select>
          </label>
          <div class="q-actions">
            <button class="q-button q-button--primary" type="submit">保存修改</button>
            <span class="q-meta" id="profile-saved" role="status" hidden>已保存</span>
          </div>
        </form>
      </section>

      <!-- 行尾带开关的列表 -->
      <section class="q-section">
        <h2 class="q-section-label">通知</h2>
        <ul class="q-list">
          <li>
            <label class="q-row q-row--inline">
              <span class="q-row-main">
                <span class="q-row-title">评论提醒</span>
                <span class="q-row-meta">有人评论我的文档时</span>
              </span>
              <input class="q-switch q-row-end" type="checkbox" checked />
            </label>
          </li>
          <li>
            <label class="q-row q-row--inline">
              <span class="q-row-main">
                <span class="q-row-title">每周摘要</span>
                <span class="q-row-meta">周一早上的一封邮件</span>
              </span>
              <input class="q-switch q-row-end" type="checkbox" checked />
            </label>
          </li>
          <li>
            <label class="q-row q-row--inline">
              <span class="q-row-main">
                <span class="q-row-title">产品动态</span>
                <span class="q-row-meta">有新功能时通知我</span>
              </span>
              <input class="q-switch q-row-end" type="checkbox" />
            </label>
          </li>
        </ul>
      </section>

      <section class="q-section">
        <h2 class="q-section-label">外观</h2>
        <div class="q-checks" role="radiogroup" aria-label="外观">
          <label class="q-check"><input type="radio" name="theme" value="system" checked />跟随系统</label>
          <label class="q-check"><input type="radio" name="theme" value="light" />浅色</label>
          <label class="q-check"><input type="radio" name="theme" value="dark" />深色</label>
        </div>
      </section>

      <section class="q-section">
        <h2 class="q-section-label">危险操作</h2>
        <p class="q-note q-note--danger">删除工作区后，里面的文档和评论都会被永久删除，无法恢复。</p>
        <div class="q-actions">
          <button class="q-button q-button--danger" type="button" id="delete-ws">删除工作区</button>
        </div>
      </section>
    </main>

    <!-- 确认对话框 -->
    <dialog class="q-dialog" id="delete-dialog" aria-labelledby="delete-title">
      <form method="dialog">
        <h2 class="q-dialog-title" id="delete-title">删除工作区？</h2>
        <p class="q-dialog-body">「潮池设计组」里的 8 篇文档会被永久删除。这是示例，点了也不会真的删除。</p>
        <div class="q-actions">
          <button class="q-button q-button--ghost" type="submit">取消</button>
          <button class="q-button q-button--danger" type="submit">删除</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
